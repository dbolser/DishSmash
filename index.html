<script>
'use strict';
/* =====================================================================
   DishSmash — a frantic dishwasher-stacking arcade game.
   Single file: vanilla JS + Canvas 2D + WebAudio. No assets, no network.

   Sections
     1. CONFIG (all tunables)          8. Machines (slam / wash / unload)
     2. Data tables (dishes, rushes)   9. Schedule (day clock, rushes)
     3. Utilities + seedable RNG      10. Rendering
     4. Rack geometry                 11. Audio (WebAudio synth)
     5. Piece logic                   12. Input (keyboard, pointer, touch)
     6. Match / nest / settle logic   13. UI screens + main loop
     7. Game state + player actions   14. Test hook (window.__dishsmash)
   ===================================================================== */

// =====================================================================
// 1. CONFIG — every tunable lives here
// =====================================================================
const CONFIG = {
  seed: null,                   // fixed seed; null = ?seed= URL param, else time
  stepMs: 1000 / 60,            // fixed simulation step
  maxFrameMs: 250,              // clamp for slow frames

  // Racks share one 9x8 coordinate space. y=0 is the BACK (top of screen),
  // y=7 the FRONT (next to the open door). Pieces fall from back to front.
  // Pieces spawn in a chute just behind the back wall (y<0, as wide as the
  // rack), so they can be moved freely before they drop in.
  //   #  tub wall / rounded corner     =  side rail notch
  //   O  water tube: a pipe raised above the back of the rack. Dishes slide
  //      under it while they fall, but nothing can come to rest on it.
  //   T  plate tines (bottom): upright plates are caught here and stand in them
  //   C  cutlery basket (bottom, cutlery only)
  //   W  wine-glass clip edge (top)    M  fold-down mug shelf (top)
  //   .  open wire rack
  bottomMap: [
    '#TTTOTTTT',
    '#TTTTTTTT',
    'TTTTTTTTT',
    '.........',
    '......CCC',
    '=.....CCC',
    '......CCC',
    '#.....CCC',
  ],
  topMap: [                      // the top rack is shallower: rows 5-7 are not part of it
    '#W..O.MM#',
    '#W....MM#',
    '#W......#',
    '#W......#',
    '##.....##',
    '#########',
    '#########',
    '#########',
  ],

  rules: { matchN: 3, cutleryMatchN: 4, maxStack: 9 },
  fall: {
    base: 2.0, perDay: 0.25, max: 6, rushBoost: 1.35,  // gravity in cells / second
    softDrop: 22, lockDelay: 0.4, maxLockResets: 12,
    dasDelay: 0.16, dasRate: 0.05,                     // key auto-repeat for left/right
  },
  anim: { nestTime: 0.42, slideTime: 0.22, topSlide: 5, closeTime: 0.55, unloadTime: 1.9 },
  wash: { cycleSec: 35, quickSec: 12, quickMult: 0.6 },
  score: {
    place: 5, softDropCell: 1, hardDropCell: 2,     // drop points are paid only when the dish locks
    nestBase: 12, comboStep: 0.5,                   // nest points x (1 + comboStep * (streak - 1))
    binPenalty: 25, swapPenalty: 10,                // swap: first swap per dish is free
    perfectRow: 150, nestPack: 0.15, rowPack: 0.2, maxPack: 6, uprightMult: 1.5,
    // fullness = dish volume (cells of every item, nested ones included) / usable cells
    fullHi: 0.85, fullLo: 0.5, fullBonus: 1.6, halfPenalty: 0.5,
  },
  clock: { dayStart: 6 * 60, dayEnd: 24 * 60, firstStart: 6 * 60 + 30, dayRealSec: 210, rushWindow: 60 },
  counter: {
    slots: 12, sink: 10, sinkFeed: 0.6,
    overflowMess: 5,          // mess added per dish that overflows the sink
    jamMessPerSec: 1.4,       // while counter + sink are both full
    drainPerSec: 1.6, drainBelow: 6,
    cupboardStart: 40, cupboardMess: 8, cupboardCooldown: 25,
  },
  batch: { perDayScale: 0.15, waveMax: 8, waveGapSec: 5 },   // big rushes arrive in waves of <= waveMax
  trickle: { every: 12, perDay: -0.6, min: 5, quietMin: 15, mix: { mug: 3, tumbler: 3, spoon: 2, smallbowl: 2, side: 1, lid: 1, fork: 1 } },
  shake: { bam: 16, wave: 8, slam: 11, hardDrop: 3, reject: 5 },
  ui: {
    bamBanner: 1.4, bannerQueue: 3,   // BAM banner seconds; banners waiting behind the current one
    chuteRows: 2,                     // visible drop chute above the rack, in cells
    hintStripH: 40,                   // portrait hint strip height (px at 390x844)
    touchMin: 44,                     // minimum touch-target height (CSS px) in portrait
  },
};

// =====================================================================
// 2. DATA TABLES
// =====================================================================
// cells are given in the spawn orientation (x right, y toward the front).
// rack: 'bottom' | 'top' | 'both' | 'basket'.  tall: casts a height shadow on the top rack.
// fam: dishes of the same family nest together (default: the type itself).
const PIECES = {
  plate:     { name: 'Dinner plate', short: 'Plate',     cells: [[0,0],[0,1],[0,2]], rack: 'bottom', pts: 30, mat: 'ceramic', color: '#f7f3ea', accent: '#3d7be0', fam: 'plates' },
  side:      { name: 'Side plate',   short: 'Side plate', cells: [[0,0],[0,1]],     rack: 'bottom', pts: 20, mat: 'ceramic', color: '#fff6d2', accent: '#f2a93b', fam: 'plates' },
  cereal:    { name: 'Cereal bowl',  short: 'Bowl',      cells: [[0,0],[1,0],[0,1],[1,1]], rack: 'bottom', pts: 35, mat: 'ceramic', color: '#ff9f43', accent: '#ffe3c2', fam: 'bowls' },
  smallbowl: { name: 'Small bowl',   short: 'Sm. bowl',  cells: [[0,0]],             rack: 'both',   pts: 15, mat: 'ceramic', color: '#2ec4b6', accent: '#c9f5ef', fam: 'bowls' },
  mug:       { name: 'Mug',          short: 'Mug',       cells: [[0,0],[1,0],[0,1]], rack: 'top',    pts: 25, mat: 'ceramic', color: '#e84a5f', accent: '#6d3b1f' },
  tumbler:   { name: 'Glass',        short: 'Glass',     cells: [[0,0]],             rack: 'top',    pts: 15, mat: 'glass',   color: '#8fdcff', accent: '#ffffff', fam: 'glasses' },
  wine:      { name: 'Wine glass',   short: 'Wine',      cells: [[0,0]],             rack: 'top',    pts: 25, mat: 'glass',   color: '#c39bff', accent: '#7b1e3a', fam: 'glasses' },
  fork:      { name: 'Fork',         short: 'Fork',      cells: [[0,0]],             rack: 'basket', pts: 8,  mat: 'metal',   color: '#cfd8dc', accent: '#78909c', cutlery: true },
  knife:     { name: 'Knife',        short: 'Knife',     cells: [[0,0]],             rack: 'basket', pts: 8,  mat: 'metal',   color: '#cfd8dc', accent: '#5d4037', cutlery: true },
  spoon:     { name: 'Spoon',        short: 'Spoon',     cells: [[0,0]],             rack: 'basket', pts: 8,  mat: 'metal',   color: '#cfd8dc', accent: '#78909c', cutlery: true },
  tupper:    { name: 'Tupperware',   short: 'Tub',       cells: [[0,0],[1,0]],       rack: 'both',   pts: 20, mat: 'plastic', color: '#7bd389', accent: '#2e8b57', fam: 'tubs' },
  lid:       { name: 'Lid',          short: 'Lid',       cells: [[0,0]],             rack: 'both',   pts: 10, mat: 'plastic', color: '#ff8fab', accent: '#c2185b', fam: 'tubs' },
  pan:       { name: 'Frying pan',   short: 'Pan',       cells: [[0,0],[1,0],[0,1],[1,1],[2,1],[3,1]], rack: 'bottom', tall: true, pts: 60, mat: 'metal', color: '#3b4a54', accent: '#6b4226' },
  pot:       { name: 'Stock pot',    short: 'Stock pot', cells: [[1,0],[0,1],[1,1],[2,1],[1,2]], rack: 'bottom', tall: true, pts: 70, mat: 'metal', color: '#b8c6cf', accent: '#7c8d99' },
  tray:      { name: 'Baking tray',  short: 'Tray',      cells: [[0,0],[0,1],[0,2],[0,3],[0,4]], rack: 'bottom', tall: true, pts: 55, mat: 'metal', color: '#4e342e', accent: '#a1887f' },
  board:     { name: 'Chopping board', short: 'Board',   cells: [[0,0],[0,1],[0,2],[0,3]], rack: 'bottom', tall: true, pts: 45, mat: 'wood', color: '#deb071', accent: '#a0703c' },
  saucepan:  { name: 'Saucepan',     short: 'Saucepan',  cells: [[0,0],[1,0],[0,1],[1,1],[2,0]], rack: 'bottom', pts: 45, mat: 'metal', color: '#c97b46', accent: '#3e2a1e' },
};

const NEST_NAMES = {
  plate: 'PLATE STACK', side: 'PLATE STACK', cereal: 'BOWL TOWER', smallbowl: 'BOWL TOWER',
  mug: 'MUG HUG', tumbler: 'GLASS NEST', wine: 'WINE CLUSTER', fork: 'FORK BUNDLE', knife: 'KNIFE BUNDLE',
  spoon: 'SPOON SPOONING', tupper: 'TUB TOWER', lid: 'LID LAYER CAKE', pan: 'PAN PILE', pot: 'POT MATRYOSHKA',
  tray: 'TRAY SANDWICH', board: 'BOARD BOOK', saucepan: 'SAUCEPAN SET',
};
const COMBO_WORDS = ['NESTED!', 'SNUG!', 'TETRIS-TIGHT!', 'DISHWASHER WIZARD!'];
const COMBO_COLORS = ['#ffd166', '#06d6a0', '#4cc9f0', '#f72585'];

// Rushes for a normal day (time = in-game minutes since midnight; fromDay = first day it happens).
const RUSHES = [
  { id: 'breakfast',   time: 7 * 60,       name: 'BREAKFAST RUSH',     base: 6, mix: { cereal: 3, mug: 3, spoon: 3, knife: 1, side: 2, tumbler: 1 } },
  { id: 'schoolrun',   time: 8 * 60 + 30,  name: 'SCHOOL RUN',         base: 4, fromDay: 4, mix: { cereal: 2, mug: 2, spoon: 2, side: 1, tumbler: 1 } },
  { id: 'elevenses',   time: 10 * 60 + 30, name: 'ELEVENSES',          base: 5, mix: { mug: 6, side: 1, spoon: 2 } },
  { id: 'lunch',       time: 12 * 60 + 30, name: 'LUNCH',              base: 8, mix: { plate: 3, tupper: 3, fork: 2, knife: 1, tumbler: 1, lid: 2 } },
  { id: 'afterschool', time: 15 * 60 + 30, name: 'AFTER-SCHOOL CRUSH', base: 7, mix: { tumbler: 4, smallbowl: 2, cereal: 1, side: 2, tupper: 2, lid: 1 } },
  { id: 'dinner',      time: 18 * 60 + 30, name: 'DINNER',             base: 9, mix: { plate: 4, fork: 3, knife: 3, spoon: 1, pan: 1, pot: 1, tray: 1, board: 1, saucepan: 1 }, guarantee: ['pan'] },
  { id: 'late',        time: 21 * 60,      name: "WINE O'CLOCK",       base: 4, mix: { wine: 5, smallbowl: 2, tumbler: 1 } },
];
// Special days repeat weekly, keyed by ((day - 1) % 7) + 1.
const SPECIAL_DAYS = {
  3: { name: 'GUESTS OVER', sub: 'Bigger dinner, far more wine', scale: { dinner: 1.6, late: 2 }, add: { dinner: { wine: 3, tumbler: 2 } } },
  5: { name: 'SUNDAY ROAST', sub: 'Every pot in the house', scale: { dinner: 0.6 },
       override: { lunch: { name: 'SUNDAY ROAST', time: 13 * 60, base: 10, mix: { pot: 2, tray: 2, board: 1, saucepan: 2, plate: 4, fork: 2, knife: 2 }, guarantee: ['pot', 'tray'] } } },
  7: { name: 'BIRTHDAY PARTY', sub: 'Cake. Everywhere.', scale: { late: 1.5 },
       override: { afterschool: { name: 'BIRTHDAY PARTY!', base: 13, mix: { side: 5, tumbler: 4, fork: 3, smallbowl: 2, wine: 2, tupper: 1 } } } },
};
const TUTORIAL_BATCH = ['cereal', 'cereal', 'cereal', 'mug', 'spoon', 'side'];

const CUPBOARD_EVENTS = [
  'Out of bowls! Dad is eating soup from a mug.',
  'Grandma is drinking tea from a measuring jug.',
  'The kids are eating cereal out of a saucepan.',
  'Someone is using a frisbee as a plate.',
  'The dog is licking the last clean bowl. Ew.',
  'Mum is stirring coffee with a chopstick.',
  'Uncle Gary is eating pasta off the chopping board.',
];
const REJECT_MSG = {
  noRoom:  'It can\'t drop in there! Move it over a gap.',
  tube:    'It can\'t rest on the water tube: the space under it is full.',
  tooBig:  'Too big for the top rack! Press E to push it in.',
  topOnly: 'That goes on the TOP rack: press E to pull it out!',
  basket:  'Cutlery only goes in the BASKET (front-right)!',
  shadow:  'Too tall! Something on the top rack is in the way (hatched cells).',
};
const REJECT_WORDS = ['NOPE!', 'NUH-UH!', 'WON\'T FIT!', 'CLONK!', 'HEY!'];

// =====================================================================
// 3. UTILITIES + SEEDABLE RNG
// =====================================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);                       // gameplay RNG (deterministic)
const rand = () => rng();
function weightedPick(mix) {
  let tot = 0; for (const k in mix) tot += mix[k];
  let r = rand() * tot;
  for (const k in mix) { r -= mix[k]; if (r < 0) return k; }
  return Object.keys(mix)[0];
}
const fxr = (a, b) => a + Math.random() * (b - a);   // visual-only randomness, never touches gameplay
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = t => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeBack = t => { t = clamp(t, 0, 1); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function fmtClock(min) {
  const h = Math.floor(min / 60) % 24, m = Math.floor(min % 60);
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seedFromUrl() {
  try {
    const s = new URLSearchParams(location.search).get('seed');
    if (s != null && s !== '') { const n = parseInt(s, 10); return isNaN(n) ? hashStr(s) : n; }
  } catch (e) { /* ignore */ }
  return null;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('dishsmash.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dishsmash.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
};
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function shade(hex, f) {   // f<0 darker, f>0 lighter
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

// =====================================================================
// 4. RACK GEOMETRY
// =====================================================================
const GW = CONFIG.bottomMap[0].length, GH = CONFIG.bottomMap.length;
const BLOCKED = new Set(['#', '=', 'O']);      // no dish may rest here
const PASS_UNDER = new Set(['O']);             // ...but falling dishes slide under these
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const RACK_NAMES = ['bottom', 'top'];
function parseRack(rows, name) {
  const cells = [];
  let usable = 0, x0 = GW, y0 = GH, x1 = -1, y1 = -1;
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const ch = (rows[y] && rows[y][x]) || '#';
    cells.push(ch);
    if (!BLOCKED.has(ch)) { usable++; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  }
  return {
    name, cells, usable, box: { x0, y0, x1, y1 },
    at(x, y) { return (x < 0 || y < 0 || x >= GW || y >= GH) ? '#' : cells[y * GW + x]; },
    open(x, y) { return !BLOCKED.has(this.at(x, y)); },
  };
}
const RACKS = { bottom: parseRack(CONFIG.bottomMap, 'bottom'), top: parseRack(CONFIG.topMap, 'top') };
const TOP_DEPTH = RACKS.top.box.y1 + 1;        // rows covered by the top rack
const USABLE = RACKS.bottom.usable + RACKS.top.usable;   // denominator for fullness

// =====================================================================
// 5. PIECE LOGIC
// =====================================================================
// Rotate clockwise: (x, y) -> (h-1-y, x). Matches ctx.rotate(+90deg) about the box centre.
function rotCW(cells) { const h = Math.max(...cells.map(c => c[1])) + 1; return cells.map(([x, y]) => [h - 1 - y, x]); }
for (const k in PIECES) {
  const d = PIECES[k];
  d.type = k; d.rots = []; d.size = d.cells.length; d.fam = d.fam || k;
  let c = d.cells;
  for (let r = 0; r < 4; r++) {
    d.rots.push({ cells: c, w: Math.max(...c.map(q => q[0])) + 1, h: Math.max(...c.map(q => q[1])) + 1 });
    c = rotCW(c);
  }
}
function pieceCells(type, rot, x, y) { return PIECES[type].rots[rot & 3].cells.map(([cx, cy]) => [x + cx, y + cy]); }
function frontY(p) { return p.y + PIECES[p.type].rots[p.rot].h - 1; }
function allowedIn(def, rack) {
  if (def.rack === 'both') return true;
  if (def.rack === 'basket') return rack === 'bottom';
  return def.rack === rack;
}
function rackLabel(def) { return def.rack === 'both' ? 'ANY' : def.rack === 'basket' ? 'BASKET' : def.rack === 'top' ? 'TOP' : 'BOTTOM'; }

function newMachine(i) {
  return {
    idx: i, name: i ? 'B' : 'A', state: 'loading', stateT: 0,
    topOut: false, topAnim: 0,
    pieces: { bottom: [], top: [] },
    occ: { bottom: new Array(GW * GH).fill(null), top: new Array(GW * GH).fill(null) },
    shadow: new Array(GW * GH).fill(null),
    pack: 1, nests: 0, rowsDone: new Set(), jammed: false,
    cycleT: 0, cycleLen: 1, quick: false, lastLoad: null, unloadPieces: null,
  };
}
function rebuildOcc(m) {
  for (const r of RACK_NAMES) {
    const o = m.occ[r]; o.fill(null);
    for (const p of m.pieces[r]) for (const [x, y] of pieceCells(p.type, p.rot, p.x, p.y)) o[y * GW + x] = p;
  }
  m.shadow.fill(null);
  for (const p of m.pieces.bottom) {
    if (!PIECES[p.type].tall) continue;
    for (const [x, y] of pieceCells(p.type, p.rot, p.x, p.y)) if (RACKS.top.open(x, y)) m.shadow[y * GW + x] = p;
  }
}
// Can the piece physically be at (x, y)? (movement rule)
// Rows y<0 are the spawn chute behind the back wall: open across the rack's width.
function fits(m, rack, type, rot, x, y, ignore) {
  const def = PIECES[type], map = RACKS[rack];
  for (const [cx, cy] of pieceCells(type, rot, x, y)) {
    if (cy < 0) { if (cx < map.box.x0 || cx > map.box.x1) return false; continue; }
    if (cx < 0 || cx >= GW || cy >= GH) return false;
    const k = map.at(cx, cy);
    if (BLOCKED.has(k) && !PASS_UNDER.has(k)) return false;
    if (k === 'C' && !def.cutlery) return false;          // basket walls keep other dishes out
    const o = m.occ[rack][cy * GW + cx];
    if (o && o !== ignore) return false;
    if (rack === 'top' && m.shadow[cy * GW + cx]) return false;
  }
  return true;
}
// Upright plates slide into the tines and are held there: they stop at the
// front edge of the tine zone instead of falling through it.
const isPlate = type => type === 'plate' || type === 'side';
function inTines(rack, type, rot, x, y) {
  return rack === 'bottom' && isPlate(type) && PIECES[type].rots[rot].w === 1 &&
    pieceCells(type, rot, x, y).every(([cx, cy]) => RACKS.bottom.at(cx, cy) === 'T');
}
function canFall(m, rack, type, rot, x, y, ignore) {
  return fits(m, rack, type, rot, x, y + 1, ignore) &&
    !(inTines(rack, type, rot, x, y) && !inTines(rack, type, rot, x, y + 1));
}
function dropY(m, rack, type, rot, x, y, ignore) { while (canFall(m, rack, type, rot, x, y, ignore)) y++; return y; }
// May the piece come to rest here? Returns null when OK, else a reason key.
function lockProblem(m, rack, type, rot, x, y) {
  const def = PIECES[type];
  const cells = pieceCells(type, rot, x, y);
  if (y < 0) return 'noRoom';                            // still (partly) in the spawn chute
  if (cells.some(([cx, cy]) => PASS_UNDER.has(RACKS[rack].at(cx, cy)))) return 'tube';
  if (def.cutlery) return (rack === 'bottom' && cells.every(([cx, cy]) => RACKS.bottom.at(cx, cy) === 'C')) ? null : 'basket';
  if (!allowedIn(def, rack)) return rack === 'top' ? 'tooBig' : 'topOnly';
  if (def.tall && rack === 'bottom') for (const [cx, cy] of cells) if (m.occ.top[cy * GW + cx]) return 'shadow';
  return null;
}
function placementBonus(p, rack) {
  const map = RACKS[rack], S = CONFIG.score;
  const cells = pieceCells(p.type, p.rot, p.x, p.y);
  const all = ch => cells.every(([x, y]) => map.at(x, y) === ch);
  if (inTines(rack, p.type, p.rot, p.x, p.y)) return { mult: S.uprightMult, label: 'UPRIGHT IN THE TINES!' };
  if (p.type === 'wine' && rack === 'top' && all('W')) return { mult: S.uprightMult, label: 'CLIPPED!' };
  if (p.type === 'mug' && rack === 'top' && all('M')) return { mult: S.uprightMult, label: 'SHELVED!' };
  return null;
}

// =====================================================================
// 6. MATCH / NEST / SETTLE LOGIC
// Rule: 3+ pieces of the same family (e.g. dinner + side plates) forming
// one orthogonally connected group nest together (cutlery: 4 of a kind).
// Chosen over "straight line" because irregular racks + multi-cell
// dishes rarely make clean lines. The group collapses into the
// front-most member, which becomes a stack (count = items, vol = their
// total cells, pts = their total points). Freed cells let dishes behind
// slide forward. A stack never holds more than rules.maxStack items.
// =====================================================================
function matchN(type) { return PIECES[type].cutlery ? CONFIG.rules.cutleryMatchN : CONFIG.rules.matchN; }
function findGroups(m, rack) {
  const occ = m.occ[rack], max = CONFIG.rules.maxStack, seen = new Set(), groups = [];

function tutorialOnSpawn(type, rack) {

// =====================================================================
// 8. MACHINES (closing, washing, unloading)
// =====================================================================
function updateMachines(dt) {
  for (const m of game.machines) {
    const target = m.topOut ? 1 : 0;
    m.topAnim += clamp(target - m.topAnim, -CONFIG.anim.topSlide * dt, CONFIG.anim.topSlide * dt);
    for (const r of RACK_NAMES) for (const p of m.pieces[r]) {
      if (p.slide > 0) p.slide = Math.max(0, p.slide - dt * 9);
      if (p.pop > 0) p.pop = Math.max(0, p.pop - dt * 2.8);
    }
    m.stateT += dt;
    if (m.state === 'closing' && m.stateT >= CONFIG.anim.closeTime) {
      m.state = 'running'; m.stateT = 0;
      if (game.active === m.idx) {
        const o = game.machines[1 - m.idx];
        if (o.state === 'loading') {
          switchMachine(o.idx);
          const g = L.mg || { gx: 0, gy: 0, cs: 10 };
          floatText('Now loading MACHINE ' + o.name, g.gx + GW * g.cs / 2, g.gy + g.cs * 1.2, '#4cc9f0', 26, 1.8);
        }
      }
    } else if (m.state === 'running') {
      m.cycleT += dt;
      if (m.cycleT >= m.cycleLen) finishWash(m);
    } else if (m.state === 'unloading' && m.stateT >= CONFIG.anim.unloadTime) {
      Object.assign(m, { pieces: { bottom: [], top: [] }, pack: 1, nests: 0, rowsDone: new Set(), state: 'loading', stateT: 0, topOut: false, unloadPieces: null, jammed: false });
      rebuildOcc(m);
      if (game.active !== m.idx && act().state !== 'loading') switchMachine(m.idx);   // the only free machine: go to it
    }
  }
}
function finishWash(m) {
  const n = itemsIn(m);
  m.state = 'unloading'; m.stateT = 0;
  game.stats.itemsWashed += n;
  game.cupboard += n;
  SFX.done();
  const src = m.idx === game.active ? L.main : L.other, dst = L.cupboard;
  if (src && dst) {
    const list = [];
    for (const r of RACK_NAMES) for (const p of m.pieces[r]) list.push(p.type);
    list.slice(0, 14).forEach((type, i) => game.flyers.push({
      type, x0: src.x + src.w * fxr(0.25, 0.75), y0: src.y + src.h * fxr(0.3, 0.7),
      x1: dst.x + dst.w / 2, y1: dst.y + dst.h / 2, t: -i * 0.07, dur: 0.9,
    }));
    floatText('+' + n + ' CLEAN!', src.x + src.w / 2, src.y + src.h * 0.3, '#9bf6ff', 30, 1.8);
    burst(src.x + src.w / 2, src.y + src.h * 0.4, 30, { color: ['#fff', '#9bf6ff', '#ffd166'], speed: 280, up: 100 });
  }
  hint('Ding! Clean dishes go back to the cupboard. Machine ' + m.name + ' is free again.', 'done');
}

// =====================================================================
// 9. SCHEDULE (day clock, rushes, trickles)
// =====================================================================
const minPerSec = () => (CONFIG.clock.dayEnd - CONFIG.clock.dayStart) / CONFIG.clock.dayRealSec;
function buildDay(day) {
  const sp = SPECIAL_DAYS[((day - 1) % 7) + 1] || null;
  const rushes = RUSHES.map(r => {
    let rr = { ...r, mix: { ...r.mix } };
    if (sp && sp.override && sp.override[r.id]) rr = { ...rr, ...sp.override[r.id], id: r.id };
    let scale = 1 + CONFIG.batch.perDayScale * (day - 1);
    if (sp && sp.scale && sp.scale[r.id]) scale *= sp.scale[r.id];
    if (sp && sp.add && sp.add[r.id]) for (const k in sp.add[r.id]) rr.mix[k] = (rr.mix[k] || 0) + sp.add[r.id][k];
    rr.count = Math.max(2, Math.round(rr.base * scale));
    return rr;
  }).filter(r => day >= (r.fromDay || 1)).sort((a, b) => a.time - b.time);
  return { special: sp, rushes };
}
// forced: from the test hook. Only the scheduled first rush of Day 1 uses the tutorial batch.
function triggerRush(r, forced = false) {
  let types;
  if (!forced && game.day === 1 && !game.firstRushDone) types = TUTORIAL_BATCH.slice();
  else {
    types = (r.guarantee || []).slice();
    while (types.length < r.count) types.push(weightedPick(r.mix));
  }
  if (!forced) game.firstRushDone = true;
  game.lastRushClock = game.clock;
  game.shake = Math.max(game.shake, CONFIG.shake.bam); game.flash = 0.35;
  showBanner('BAM! ' + r.name, types.length + ' dirty dishes incoming!', '#ff5d5d', CONFIG.ui.bamBanner, true);
  SFX.bam();
  // big rushes arrive in waves so a single dump never floods the counter
  const B = CONFIG.batch;
  for (let k = 0; k * B.waveMax < types.length; k++) {
    const wave = types.slice(k * B.waveMax, (k + 1) * B.waveMax);
    if (k === 0) dumpWave(wave, true);
    else game.waves.push({ types: wave, in: k * B.waveGapSec });
  }
  hint(IS_TOUCH ? 'Tap a dish on the counter to load it.' : 'Pick a dish from the counter: click it, press its number key, or Q / W then Enter.', 'pick');
  return types;
}
function dumpWave(types, first) {
  const cr = L.counter || { x: 0, y: 0, w: 100, h: 100 };
  burst(cr.x + cr.w / 2, cr.y + 10, first ? 40 : 20, { color: ['#fff', '#ffe3c2', '#ff9f43', '#cfd8dc'], kind: 'shard', speed: 380, up: 200 });
  if (!first) {
    game.shake = Math.max(game.shake, CONFIG.shake.wave);
    floatText('AND MORE! +' + types.length, cr.x + cr.w / 2, cr.y + 24, '#ff5d5d', 26, 1.6);
    SFX.crash();
  }
  addItems(types, true);
  useCupboard(types.length);
}
function updateClock(dt) {
  game.clock += dt * minPerSec();
  const rs = game.schedule.rushes;
  while (game.rushIdx < rs.length && game.clock >= rs[game.rushIdx].time) { triggerRush(rs[game.rushIdx]); game.rushIdx++; }
  for (const w of game.waves) w.in -= dt;
  while (game.waves.length && game.waves[0].in <= 0) dumpWave(game.waves.shift().types, false);
  game.trickleT -= dt;
  if (game.trickleT <= 0) {
    const T = CONFIG.trickle, nxt = rs[game.rushIdx], prev = rs[game.rushIdx - 1];
    const near = (nxt && nxt.time - game.clock < T.quietMin) || (prev && game.clock - prev.time < T.quietMin);
    if (game.firstRushDone && !near) {
      const n = 1 + (rand() < 0.3 + 0.06 * game.day ? 1 : 0), types = [];
      for (let i = 0; i < n; i++) types.push(weightedPick(T.mix));
      addItems(types, false);
      useCupboard(n);
      const cr = L.counter || { x: 0, y: 0, w: 0 };
      floatText('+' + n + ' dirty', cr.x + cr.w / 2, cr.y + 14, '#ffe3c2', 16);
      SFX.clink('ceramic', 0.9);
    }
    game.trickleT = Math.max(T.min, T.every + T.perDay * (game.day - 1));
  }
  if (game.clock >= CONFIG.clock.dayEnd) {
    game.day++;
    game.clock = CONFIG.clock.dayStart;
    game.lastRushClock = -999;
    game.schedule = buildDay(game.day);
    game.rushIdx = 0;
    const sp = game.schedule.special;
    showBanner('DAY ' + game.day, sp ? sp.name + ': ' + sp.sub : 'Bigger batches. Faster dishes.', sp ? '#f72585' : '#ffd166', 2.8);
    SFX.fanfare();

  }
}
function nextRushes(n) {
  const out = [], rs = game.schedule.rushes;
  for (let i = game.rushIdx; i < rs.length && out.length < n; i++) out.push({ r: rs[i], inSec: (rs[i].time - game.clock) / minPerSec() });
  if (out.length < n) {   // peek into tomorrow
    const tomorrow = buildDayPreview(game.day + 1);
    const toMidnight = (CONFIG.clock.dayEnd - game.clock) / minPerSec();
    for (const r of tomorrow) { if (out.length >= n) break; out.push({ r, inSec: toMidnight + (r.time - CONFIG.clock.dayStart) / minPerSec(), tomorrow: true }); }
  }
  return out;
}
function buildDayPreview(day) {   // pure: no RNG use
  const sp = SPECIAL_DAYS[((day - 1) % 7) + 1] || null;
  return RUSHES.filter(r => day >= (r.fromDay || 1)).map(r => (sp && sp.override && sp.override[r.id]) ? { ...r, ...sp.override[r.id] } : r).sort((a, b) => a.time - b.time);
}
function updateCounter(dt) {
  const C = CONFIG.counter;
  game.sinkT -= dt;
  if (game.sink.length && game.counter.length < C.slots && game.sinkT <= 0) {
    game.counter.push({ ...game.sink.shift(), born: game.t });
    game.sinkT = C.sinkFeed;
  }
  const full = game.counter.length >= C.slots;
  if (full && game.sink.length) game.mess += C.jamMessPerSec * dt * (game.sink.length / C.sink) * (1 + 0.15 * (game.day - 1));
  else if (game.counter.length <= C.drainBelow && game.sink.length === 0) game.mess -= C.drainPerSec * dt;
  game.mess = clamp(game.mess, 0, 100);
  if (game.mess > 55) hint('The MESS is rising! Load faster or the kitchen will fall!', 'mess');
  if (game.mess >= 100) gameOver();
  game.cursor = clamp(game.cursor, 0, Math.max(0, game.counter.length - 1));
  if (game.cupboardCooldown > 0) game.cupboardCooldown -= dt;
  if (game.cupboardFlash > 0) game.cupboardFlash -= dt;
}
function gameOver() {
  if (game.screen !== 'play') return;
  game.screen = 'over'; game.falling = null; game.resolve = null; game.overAt = game.uiT;
  game.stats.inWash = game.machines.filter(m => m.state === 'closing' || m.state === 'running').reduce((n, m) => n + itemsIn(m), 0);
  const best = store.get('best', { score: 0, day: 0 });
  game.newBest = game.score > best.score;
  best.score = Math.max(best.score, game.score); best.day = Math.max(best.day, game.day);
  store.set('best', best); game.best = best;
  game.banner = null; game.bannerQ = [];        // the game-over card carries the message
  SFX.gameOver();
  game.shake = 20;
}

// ---- fx update ----
function updateFx(dt) {
  game.shake = Math.max(0, game.shake * (1 - dt * 7) - dt * 3);
  game.flash = Math.max(0, game.flash - dt * 1.6);
  for (const p of game.parts) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.rot += p.vr * dt;
    if (p.kind === 'bubble') { p.vx += Math.sin((p.life + p.rot) * 6) * 30 * dt; }
    if (p.kind === 'steam') { p.size += dt * 14; }
  }
  game.parts = game.parts.filter(p => p.life > 0);
  if (game.parts.length > 900) game.parts.splice(0, game.parts.length - 900);
  for (const t of game.texts) { t.life -= dt; t.y += t.vy * dt; t.vy *= 1 - dt * 1.5; }
  game.texts = game.texts.filter(t => t.life > 0);
  for (const gh of game.ghosts) gh.t += dt;
  game.ghosts = game.ghosts.filter(g => g.t < g.dur);
  for (const f of game.flyers) f.t += dt;
  const landed = game.flyers.filter(f => f.t >= f.dur);
  if (landed.length) { game.cupboardFlash = Math.max(game.cupboardFlash || 0, 0.4); if (Math.random() < 0.5) SFX.clink('ceramic', 1.3); }
  game.flyers = game.flyers.filter(f => f.t < f.dur);
  if (game.comboText) { game.comboText.t += dt; if (game.comboText.t > game.comboText.max) game.comboText = null; }
  if (game.banner) { game.banner.t += dt; if (game.banner.t > game.banner.max) game.banner = game.bannerQ.shift() || null; }
  if (game.hint) { game.hint.t += dt; if (game.hint.t > game.hint.dur) game.hint = null; }
  // ambient: bubbles + steam from running machines
  if (game.screen === 'play') for (const m of game.machines) {
    if (m.state !== 'running') continue;
    const r = m.idx === game.active ? L.main : L.other; if (!r) continue;
    if (Math.random() < dt * 14) game.parts.push({ kind: 'bubble', x: r.x + r.w * fxr(0.15, 0.85), y: r.y + r.h * fxr(0.55, 0.95), vx: 0, vy: fxr(-60, -25), life: fxr(1, 2), max: 2, size: fxr(3, 8), color: 'rgba(255,255,255,0.8)', g: 0, rot: fxr(0, 6), vr: 0 });
    if (Math.random() < dt * 6) game.parts.push({ kind: 'steam', x: r.x + r.w * fxr(0.3, 0.7), y: r.y + r.h * 0.12, vx: fxr(-10, 10), vy: fxr(-40, -20), life: fxr(1.2, 2), max: 2, size: fxr(8, 14), color: 'rgba(255,255,255,0.35)', g: 0, rot: 0, vr: 0 });
  }
}

// Master fixed-step update.
function update(dt) {
  game.t += dt;
  if (game.screen === 'play' && !game.paused) {
    updateClock(dt);
    updateInput(dt);
    updateFalling(dt);
    updateResolve(dt);
    updateMachines(dt);
    updateCounter(dt);
  }
  if (!game.paused) updateFx(dt);
}

// =====================================================================
// 10. RENDERING
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const FONT = '"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif';
const IS_TOUCH = (() => { try { return matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window; } catch (e) { return false; } })();
let DPR = 1;
const L = {};
let bgCache = null;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(320, window.innerWidth), h = Math.max(320, window.innerHeight);
  canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  layout(w, h);
  bgCache = null;
}
function layout(w, h) {

    const s = L.s = Math.min(w / 1280, h / 800);
    const pad = L.pad = Math.max(6, 12 * s);

    const rowY = L.counter.y + L.counter.h + pad, rowH = H * 0.24;
    L.sink = { x: pad, y: rowY, w: leftW * 0.56 - pad / 2, h: rowH };
    L.cupboard = { x: pad + leftW * 0.56 + pad / 2, y: rowY, w: leftW * 0.44 - pad / 2, h: rowH };
    L.mess = { x: pad, y: rowY + rowH + pad, w: leftW, h: bottom - (rowY + rowH + pad) };
    const mainX = pad * 2 + leftW, mainW = w - mainX - rightW - pad * 2;
    const padH = L.showPad ? Math.max(70, 96 * s) : 0;
    L.main = { x: mainX, y: top, w: mainW, h: H - padH - (padH ? pad : 0) };
    L.padR = padH ? { x: mainX, y: bottom - padH, w: mainW, h: padH } : null;
    const rx = w - pad - rightW;
    L.other = { x: rx, y: top, w: rightW, h: H * 0.34 };
    L.gauge = { x: rx, y: L.other.y + L.other.h + pad, w: rightW, h: H * 0.2 };
    L.actions = { x: rx, y: L.gauge.y + L.gauge.h + pad, w: rightW, h: bottom - (L.gauge.y + L.gauge.h + pad) };
    L.cols = 3; L.rows = 4; L.hintR = null;
  } else {
    // Phone: machine with a side column (other machine + gauge), then one row of
    // action buttons, the counter, sink/cupboard/mess, and the move pad. Every
    // touch target is at least CONFIG.ui.touchMin tall.
    const s = L.s = Math.min(w / 390, h / 844), tm = CONFIG.ui.touchMin;
    const pad = L.pad = Math.max(5, 8 * s), cw = w - 2 * pad;
    const hudH = 66 * s;
    L.hud = { x: pad, y: pad, w: cw, h: hudH };
    const hintH = CONFIG.ui.hintStripH * s, actH = Math.max(tm + 4, 48 * s), padH = Math.max(tm + 8, 62 * s), rowH = Math.max(34, 44 * s);
    L.cols = 6; L.rows = 2;
    const counterH = counterHead() + 2 * Math.max(4, 8 * s) + L.rows * (Math.max(tm + 2, 50 * s) + 6);
    let y = pad * 2 + hudH;
    L.hintR = { x: pad, y, w: cw, h: hintH }; y += hintH + pad;   // hints get their own strip, off the rack

// ---------- counter / sink / cupboard / mess ----------
const counterHead = () => Math.max(18, 26 * L.s);
function counterSlotRect(i) {
  const r = L.counter, pad = Math.max(4, 8 * L.s), head = counterHead();
  const gw = r.w - pad * 2, gh = r.h - pad * 2 - head;
  const cw = gw / L.cols, ch = gh / L.rows;
  const c = i % L.cols, row = Math.floor(i / L.cols);
  return { x: r.x + pad + c * cw + 3, y: r.y + pad + head + row * ch + 3, w: cw - 6, h: ch - 6 };
}
function drawCounter() {
  const r = L.counter, C = CONFIG.counter;
  const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h); g.addColorStop(0, '#d39a62'); g.addColorStop(1, '#b77945');
  panel(r, g, { radius: 16 });
  ctx.save(); rrect(r.x, r.y, r.w, r.h, 16); ctx.clip();
  ctx.strokeStyle = 'rgba(120,70,30,0.18)'; ctx.lineWidth = 2;

  ctx.restore();
  const head = counterHead(), full = game.counter.length >= C.slots;
  text('COUNTER  ' + game.counter.length + '/' + C.slots, r.x + 12, r.y + 8 + head / 2, head * 0.62, full ? '#ffe0e0' : '#fff6e8', { align: 'left', stroke: 'rgba(80,40,10,0.5)' });
  if (!L.portrait && !IS_TOUCH) text('keys 1-0 · Q/W + Enter · click', r.x + r.w - 10, r.y + 8 + head / 2, head * 0.45, 'rgba(255,246,232,0.8)', { align: 'right', weight: 700 });

  const s0 = counterSlotRect(0);
  ctx.save(); ctx.beginPath(); ctx.rect(r.x, s0.y - 8, r.w, r.y + r.h - (s0.y - 8)); ctx.clip();
  for (let i = 0; i < C.slots; i++) {
    const sr = counterSlotRect(i);
    const item = game.counter[i];
    if (!item) { rrect(sr.x, sr.y, sr.w, sr.h, 10); ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(255,240,220,0.35)'; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]); continue; }
    const k = clamp((game.t - item.born) / 0.35, 0, 1);
    if (k <= 0) continue;
    const sel = i === game.cursor && game.screen === 'play';
    const oy = (1 - easeBack(k)) * -sr.h * 0.6 + (sel ? Math.sin(game.uiT * 6) * 2 - 2 : 0);
    ctx.globalAlpha = clamp(k * 2.5, 0, 1);

    ctx.globalAlpha = 1;

}

// ---------- the dishwasher ----------
function drawRack(map, gx, gy, cs, isTop) {
  const open = (x, y) => map.open(x, y);
  const wire = isTop ? '#eef5fc' : '#dfe7ee', wireShadow = 'rgba(10,20,30,0.45)';
  const lw = Math.max(1.2, cs * 0.05);
  if (isTop) {   // top rack floor tint so it reads as a separate layer
    const b = map.box;
    rrect(gx + b.x0 * cs - cs * 0.12, gy + b.y0 * cs - cs * 0.12, (b.x1 - b.x0 + 1) * cs + cs * 0.24, (b.y1 - b.y0 + 1) * cs + cs * 0.24, cs * 0.5);
    ctx.fillStyle = 'rgba(70,95,120,0.88)'; ctx.fill();
  }
  // wire mesh along cell centres (not a chessboard)
  for (const pass of [0, 1]) {
    ctx.strokeStyle = pass ? wire : wireShadow; ctx.lineWidth = pass ? lw : lw * 1.4;
    const o = pass ? 0 : lw * 0.9;
    ctx.beginPath();
    for (let y = 0; y < GH; y++) {
      let x = 0;
      while (x < GW) {
        if (!open(x, y) || map.at(x, y) === 'C') { x++; continue; }
        const s = x; while (x < GW && open(x, y) && map.at(x, y) !== 'C') x++;
        ctx.moveTo(gx + s * cs + cs * 0.1, gy + (y + 0.5) * cs + o); ctx.lineTo(gx + x * cs - cs * 0.1, gy + (y + 0.5) * cs + o);
      }
    }
    for (let x = 0; x < GW; x++) {
      let y = 0;
      while (y < GH) {
        if (!open(x, y) || map.at(x, y) === 'C') { y++; continue; }
        const s = y; while (y < GH && open(x, y) && map.at(x, y) !== 'C') y++;
        ctx.moveTo(gx + (x + 0.5) * cs + o, gy + s * cs + cs * 0.1); ctx.lineTo(gx + (x + 0.5) * cs + o, gy + y * cs - cs * 0.1);
      }
    }
    ctx.stroke();
  }

  for (const pass of [0, 1]) {
    ctx.strokeStyle = pass ? (isTop ? '#ffffff' : '#f1f5f8') : wireShadow; ctx.lineWidth = pass ? cs * 0.11 : cs * 0.15;
    const o = pass ? 0 : cs * 0.04;
    ctx.beginPath();
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
      if (!open(x, y)) continue;
      const X = gx + x * cs, Y = gy + y * cs + o;
      if (!open(x, y - 1)) { ctx.moveTo(X, Y); ctx.lineTo(X + cs, Y); }
      if (!open(x, y + 1)) { ctx.moveTo(X, Y + cs); ctx.lineTo(X + cs, Y + cs); }
      if (!open(x - 1, y)) { ctx.moveTo(X, Y); ctx.lineTo(X, Y + cs); }
      if (!open(x + 1, y)) { ctx.moveTo(X + cs, Y); ctx.lineTo(X + cs, Y + cs); }
    }
    ctx.stroke();
  }
  // special zones
  const zone = ch => { const cells = []; for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (map.at(x, y) === ch) cells.push([x, y]); return cells; };
  const bbox = cells => { let x0 = 99, y0 = 99, x1 = -1, y1 = -1; for (const [x, y] of cells) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); } return { x: gx + x0 * cs, y: gy + y0 * cs, w: (x1 - x0 + 1) * cs, h: (y1 - y0 + 1) * cs }; };
  // water tube (bottom) / spray-arm dock (top): a pipe running in from the back wall
  for (const [x, y] of zone('O')) {
    const cx = gx + (x + 0.5) * cs, cy = gy + (y + 0.5) * cs;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(cx - cs * 0.2 + 2, gy - cs, cs * 0.4, cy - gy + cs);
    const pg = ctx.createLinearGradient(cx - cs * 0.2, 0, cx + cs * 0.2, 0); pg.addColorStop(0, '#8d9ba6'); pg.addColorStop(0.5, '#f5f7f9'); pg.addColorStop(1, '#8d9ba6');
    ctx.fillStyle = pg; ctx.fillRect(cx - cs * 0.2, gy - cs, cs * 0.4, cy - gy + cs);
    circle(cx, cy + cs * 0.06, cs * 0.4); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    circle(cx, cy, cs * 0.38); ctx.fillStyle = radial(cx, cy, cs * 0.38, '#f5f7f9', '#8d9ba6'); ctx.fill();
    circle(cx, cy, cs * 0.14); ctx.fillStyle = '#37474f'; ctx.fill();
  }
  if (!isTop) {

  const dh = lerp(bh * 0.25, bh, easeOut(clamp((k - 0.2) / 0.2, 0, 1)));
  rrect(bx, by + bh - dh, bw, dh, 8); ctx.fillStyle = '#eef2f5'; ctx.fill(); ctx.strokeStyle = '#7d8c99'; ctx.lineWidth = 2; ctx.stroke();
  if (k > 0.4) { text('SLAM!', r.x + r.w / 2, r.y + r.h * 0.35, cs * 0.7, '#ef476f', { stroke: '#2b1640' }); text('FULL LOAD', r.x + r.w / 2, r.y + r.h * 0.7, cs * 0.4, '#06d6a0', { stroke: '#2b1640' }); }
}
function drawPause() {
  ctx.fillStyle = 'rgba(30,15,40,0.6)'; ctx.fillRect(0, 0, L.w, L.h);
  const s = Math.min(1.2, L.w / 600);
  text('PAUSED', L.w / 2, L.h * 0.38, 72 * s, '#fff', { stroke: '#2b1640', strokeW: 10, weight: 900 });
  text('P / Esc to resume  ·  M to ' + (SFX.muted ? 'unmute' : 'mute'), L.w / 2, L.h * 0.38 + 60 * s, 18 * s, '#fff', { weight: 700 });
  const bw = 240, bh = 60;
  button({ x: L.w / 2 - bw / 2, y: L.h * 0.55, w: bw, h: bh }, 'RESUME', togglePause, { color: '#06d6a0', id: 'resume' });
  button({ x: L.w / 2 - bw / 2, y: L.h * 0.55 + bh + 14, w: bw, h: bh * 0.8 }, 'Quit to title', () => { game.screen = 'title'; game.paused = false; }, { color: '#8d6e63', id: 'quit' });
}
function drawGameOver() {
  game.overT = game.uiT - (game.overAt || 0);
  const a = clamp(game.overT * 2, 0, 1);
  ctx.fillStyle = `rgba(30,15,40,${0.7 * a})`; ctx.fillRect(0, 0, L.w, L.h);
  const cw = Math.min(520, L.w - 32), ch = Math.min(560, L.h - 40), cx = L.w / 2 - cw / 2, cy = L.h / 2 - ch / 2 + (1 - easeBack(a)) * 80;
  panel({ x: cx, y: cy, w: cw, h: ch }, '#fffdf6', { radius: 20, stroke: '#ef476f', lw: 5 });
  const sz = Math.min(40, cw / 12);
  text('THE KITCHEN', L.w / 2, cy + ch * 0.09, sz, '#ef476f', { stroke: '#2b1640', strokeW: 6, weight: 900 });
  text('HAS FALLEN', L.w / 2, cy + ch * 0.09 + sz * 1.05, sz, '#ef476f', { stroke: '#2b1640', strokeW: 6, weight: 900 });
  const st = game.stats, eco = st.loads ? st.fullSum / st.loads : 0;
  const grade = !st.loads ? '-' : eco >= 0.9 ? 'A+  Eco hero' : eco >= 0.8 ? 'A' : eco >= 0.7 ? 'B' : eco >= 0.6 ? 'C' : eco >= 0.5 ? 'D' : 'F  Planet sad';
  const rows = [
    ['Score', game.score.toLocaleString('en-GB') + (game.newBest ? '  NEW BEST!' : '')],
    ['Day reached', String(game.day)],
    ['Items washed', st.itemsWashed + (st.inWash ? '  (+' + st.inWash + ' in the wash)' : '')],
    ['Loads run', String(st.loads)],
    ['Best combo', st.bestCombo ? '×' + st.bestCombo : '-'],
    ['Nests / perfect rows', st.nests + ' / ' + st.perfectRows],
    ['Eco rating (avg fullness)', grade + (st.loads ? '  (' + Math.round(eco * 100) + '%)' : '')],
  ];
  const fs = Math.min(19, cw / 26), ry = cy + ch * 0.27;
  rows.forEach(([k, v], i) => {
    const yy = ry + i * fs * 1.75;
    text(k, cx + 26, yy, fs, '#5a4a3a', { align: 'left', weight: 700 });
    text(v, cx + cw - 26, yy, fs, i === 0 && game.newBest ? '#ef476f' : '#3a2c5a', { align: 'right', weight: 900 });
  });
  text('Best ever: ' + game.best.score.toLocaleString('en-GB') + '  ·  furthest day ' + game.best.day, L.w / 2, ry + rows.length * fs * 1.75 + 4, fs * 0.8, '#7a6a5a', { weight: 700 });
  if (game.overT > 1) {
    const bw = Math.min(280, cw - 40), bh = 62;
    button({ x: L.w / 2 - bw / 2, y: cy + ch - bh - 22, w: bw, h: bh }, 'PLAY AGAIN', startFromTitle, { color: '#06d6a0', glow: true, sub: IS_TOUCH ? '' : 'Enter / R', id: 'again' });
  }
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  game.buttons = [];
  drawBackground();
  if (game.screen === 'title') { drawTitle(); drawParticles(); return; }
  ctx.save();
  if (game.shake > 0.3) ctx.translate(fxr(-1, 1) * game.shake, fxr(-1, 1) * game.shake);
  drawHUD();
  drawCounter(); drawSink(); drawCupboard(); drawMess();
  drawActiveMachine();
  drawOtherMachine(); drawGauge(); drawActions();
  if (L.showPad) drawPad();
  drawFlyers(); drawParticles(); drawTexts(); drawComboText(); drawHint(); drawBanner();
  ctx.restore();
  if (game.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${game.flash * 0.6})`; ctx.fillRect(0, 0, L.w, L.h); }
  if (game.paused && game.screen === 'play') { game.buttons = []; drawPause(); }   // nothing under an overlay is clickable
  if (game.screen === 'over') { game.buttons = []; drawGameOver(); }
}
let lastNow = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - lastNow; lastNow = now;
  if (dt > CONFIG.maxFrameMs) dt = CONFIG.maxFrameMs;
  if (dt < 0) dt = 0;
  game.uiT += dt / 1000;
  if (!game.frozen) {
    acc += dt;
    while (acc >= CONFIG.stepMs) { update(CONFIG.stepMs / 1000); acc -= CONFIG.stepMs; }
  } else acc = 0;
  const running = game.screen === 'play' ? game.machines.filter(m => m.state === 'running').length : 0;
  SFX.setHum(game.paused ? 0 : running * 0.045);
  try { render(); } catch (e) { console.error(e); throw e; }
}

// =====================================================================
// 14. TEST HOOK — deterministic control for automated tests
// =====================================================================
function snapshot() {
  const rackGrid = (m, rack) => {
    const rows = [];
    for (let y = 0; y < GH; y++) {
      let s = '';
      for (let x = 0; x < GW; x++) {
        const i = y * GW + x, ch = RACKS[rack].at(x, y);
        if (BLOCKED.has(ch)) s += '#';
        else if (m.occ[rack][i]) s += m.occ[rack][i].type[0];
        else if (rack === 'top' && m.shadow[i]) s += '/';
        else s += '.';
      }
      rows.push(s);
    }
    return rows;
  };
  return JSON.parse(JSON.stringify({
    screen: game.screen, paused: game.paused, frozen: game.frozen, seed: game.seed, t: +game.t.toFixed(3),
    day: game.day, clock: game.clock, clockStr: game.clock != null ? fmtClock(game.clock) : null, special: game.schedule ? (game.schedule.special && game.schedule.special.name) : null,
    score: game.score, mess: game.mess, cupboard: game.cupboard, active: game.active, cursor: game.cursor,
    counter: (game.counter || []).map(i => i.type), sink: (game.sink || []).map(i => i.type),
    falling: game.falling ? { type: game.falling.type, rot: game.falling.rot, x: game.falling.x, y: game.falling.y, rack: game.falling.rack } : null,
    resolving: !!game.resolve, combo: game.combo, swapUsed: game.swapUsed, pendingWaves: (game.waves || []).map(w => w.types.length),
    nextRush: game.schedule ? nextRushes(1).map(n => ({ id: n.r.id, name: n.r.name, inSec: +n.inSec.toFixed(2) }))[0] : null,
    stats: game.stats,
    machines: game.machines.map(m => ({
      name: m.name, state: m.state, topOut: m.topOut, fullness: +fullness(m).toFixed(3), items: itemsIn(m), pack: +m.pack.toFixed(3), nests: m.nests, jammed: m.jammed,
      cycleLeft: m.state === 'running' ? +(m.cycleLen - m.cycleT).toFixed(2) : 0, lastLoad: m.lastLoad,
      pieces: RACK_NAMES.flatMap(r => m.pieces[r].map(p => ({ rack: r, type: p.type, x: p.x, y: p.y, rot: p.rot, count: p.count, vol: p.vol }))),
      grid: { bottom: rackGrid(m, 'bottom'), top: rackGrid(m, 'top') },
    })),
  }));
}
window.__dishsmash = Object.freeze({
  state: snapshot,
  config: CONFIG,
  start(seed) { SFX.init(); newGame(seed == null ? 1 : seed); return snapshot(); },
  pause() { game.frozen = true; return true; },
  resume() { game.frozen = false; lastNow = performance.now(); acc = 0; return true; },
  step(ms) {
    const n = Math.max(1, Math.round((ms == null ? CONFIG.stepMs : ms) / CONFIG.stepMs));
    for (let i = 0; i < n; i++) update(CONFIG.stepMs / 1000);
    render();
    return snapshot();
  },
  pick: i => pick(i),
  move(dx) { let ok = true; const s = Math.sign(dx); for (let i = 0; i < Math.abs(dx); i++) ok = tryMove(s, 0) && ok; return ok; },
  rotate: (dir = 1) => rotatePiece(dir),
  softDrop(cells = 1) { let n = 0; for (let i = 0; i < cells; i++) if (tryMove(0, 1)) n++; return n; },
  hardDrop: () => hardDrop(),
  toggleTopRack: () => toggleTopRack(),
  switchMachine: i => switchMachine(i),
  slam: quick => slam(!!quick),
  binBack: () => binBack(),
  forceRush(name) {
    const key = String(name || '').toLowerCase();
    const r = (game.schedule ? game.schedule.rushes : []).find(r => r.id === key || r.name.toLowerCase().includes(key)) || RUSHES.find(r => r.id === key);
    if (!r || game.screen !== 'play') return null;
    return triggerRush({ ...r, count: r.count || r.base }, true);   // never the tutorial batch
  },
  spawnBatch(types) { addItems((types || []).filter(t => PIECES[t]), false); return game.counter.map(i => i.type); },
  render: () => render(),
});

// boot
resize();
requestAnimationFrame(frame);
</script>
